{% extends "base.html" %}
{% block title %}جستجوی محصول · لیستیا{% endblock %}

{% block content %}

  <div class="page-head">
    <div>
      <h1 class="page-title">🔍 جستجوی محصول در لیستیا</h1>
      <div class="page-sub">جستجوی هوشمند در کالاها و تأمین‌کنندگان</div>
    </div>
  </div>

  <div class="card card-pad" style="margin-bottom:20px;">
    <input id="search-input" class="field" style="width:100%; max-width:420px;" value="{{ request.args.get('q', '') }}" placeholder="نام محصول یا تأمین‌کننده را تایپ کن..." autocomplete="off" autofocus>
  </div>

  <div id="search-status" style="font-size:12.5px; color:var(--ink-faint); margin-bottom:10px;"></div>

  <div id="results-card" class="card table-scroll" style="display:none;">
    <table class="data">
      <tr>
        <th>تأمین‌کننده</th>
        <th>نام محصول</th>
        <th>تعداد</th>
        <th>نوع تعداد</th>
        <th>وضعیت</th>
      </tr>
      <tbody id="results-body"></tbody>
    </table>
  </div>

  <script>
    const searchInput = document.getElementById("search-input");
    const resultsCard = document.getElementById("results-card");
    const resultsBody = document.getElementById("results-body");
    const searchStatus = document.getElementById("search-status");

    let timer = null;

    function doSearch(q) {
      q = (q || "").trim();
      if (q.length < 2) {
        resultsCard.style.display = "none";
        resultsBody.innerHTML = "";
        searchStatus.textContent = q.length === 1 ? "برای جستجو حداقل ۲ حرف بنویسید" : "";
        return;
      }

      searchStatus.textContent = "در حال جستجو...";

      App.request("/api/search?q=" + encodeURIComponent(q))
        .then(function (result) {
          if (!result.ok) {
            searchStatus.textContent = "خطا در دریافت نتایج";
            return;
          }

          const products = result.data.results || [];
          if (products.length === 0) {
            searchStatus.textContent = "نتیجه‌ای یافت نشد.";
            resultsCard.style.display = "none";
            resultsBody.innerHTML = "";
            return;
          }

          searchStatus.textContent = products.length + " محصول پیدا شد:";
          resultsBody.innerHTML = products.map(function (p) {
            const href = '/supplier/' + p.supplier_id + '?highlight=' + p.id;
            return (
              '<tr class="search-row" role="link" tabindex="0" data-href="' + escapeAttr(href) + '">' +
                '<td>' + escapeHtml(p.supplier_name) + '</td>' +
                '<td><strong>' + escapeHtml(p.product_name) + '</strong></td>' +
                '<td class="mono">' + escapeHtml(p.quantity) + '</td>' +
                '<td><span class="tag">' + escapeHtml(p.unit) + '</span></td>' +
                '<td>' + (p.ordered ? '<span class="tag tag-success">آرشیو (' + escapeHtml(p.ordered_date_label || '') + ')</span>' : '<span class="tag tag-accent">فعال</span>') + '</td>' +
              '</tr>'
            );
          }).join("");
          resultsCard.style.display = "block";
        })
        .catch(function () {
          searchStatus.textContent = "خطا در ارتباط با سرور";
        });
    }

    resultsBody.addEventListener("click", function (event) {
      const row = event.target.closest("tr[data-href]");
      if (row) location.href = row.dataset.href;
    });
    resultsBody.addEventListener("keydown", function (event) {
      const row = event.target.closest("tr[data-href]");
      if (row && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        location.href = row.dataset.href;
      }
    });

    searchInput.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { doSearch(searchInput.value); }, 200);
    });

    if (searchInput.value.trim().length >= 2) {
      doSearch(searchInput.value);
    }
  </script>

{% endblock %}
