<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142430">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ 'ثبت‌نام در لیستیا' if mode == 'signup' else 'ورود به لیستیا' }} · لیستیا</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v={{ asset_v }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v={{ asset_v }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v={{ asset_v }}">
  <link rel="manifest" href="/manifest.webmanifest?v={{ asset_v }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">

  <style>
    .login-shell {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(900px 420px at 20% -10%, rgba(224,160,48,.18), transparent 60%),
        radial-gradient(700px 380px at 90% 110%, rgba(47,111,118,.28), transparent 60%),
        linear-gradient(170deg, #142430, #1B3142);
      padding: 20px;
    }
    .login-card {
      width: 100%; max-width: {{ '430px' if mode == 'signup' else '360px' }};
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-pop);
      padding: 32px 28px;
      animation: fadeUp .34s var(--ease) both;
    }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .login-brand-mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(150deg, #E8AE43, var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 20px; color: var(--accent-ink);
      box-shadow: 0 6px 16px rgba(224,160,48,.3);
    }
    .login-brand-title { font-weight: 800; font-size: 18px; color: var(--ink); }
    .login-tagline { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 20px; }
    .login-field {
      width: 100%; height: 46px; margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      font-size: 14px; font-family: var(--font-body);
      outline: none;
      transition: border-color var(--fast), box-shadow var(--fast);
    }
    .login-field:focus { border-color: var(--teal); box-shadow: var(--shadow-focus); }
    .login-name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .login-phone { direction: ltr; text-align: left; }
    @media (max-width: 430px) {
      .login-name-row { grid-template-columns: 1fr; gap: 0; }
    }
    .login-btn {
      width: 100%; height: 46px; border: none;
      border-radius: var(--radius-sm);
      background: var(--sidebar-bg); color: #fff;
      font-weight: 700; font-size: 14px; font-family: var(--font-body);
      cursor: pointer; margin-top: 6px;
      transition: transform var(--fast), box-shadow var(--med), background var(--fast);
    }
    .login-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(19,35,48,.26); }
    .login-btn:active { transform: scale(.98); }
    .login-btn.signup { background: linear-gradient(145deg, #E8AE43, var(--accent)); color: var(--accent-ink); }
    .login-error {
      background: var(--danger-bg); color: var(--danger);
      font-size: 12.5px; padding: 10px 12px;
      border-radius: var(--radius-sm); margin-bottom: 14px;
      animation: shake .3s var(--ease);
    }
    .login-hint {
      background: var(--teal-soft); color: var(--teal);
      font-size: 12px; padding: 9px 12px;
      border-radius: var(--radius-sm); margin-bottom: 14px;
    }
    .login-switch { text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--ink-soft); }
    .login-switch a { color: var(--teal); font-weight: 600; text-decoration: none; }
    .login-switch a:hover { text-decoration: underline; }
    .login-credit {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,.55);
      font-family: var(--font-body);
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <img class="login-brand-mark" src="/logo-192.png?v={{ asset_v }}" alt="لیستیا" width="42" height="42" style="object-fit:cover;padding:0;"
             onerror="this.onerror=null; this.src='{{ url_for('static', filename='logo.png') }}?v={{ asset_v }}';">
        <div>
          <div class="login-brand-title">لیستیا</div>
        </div>
      </div>
      <p class="login-tagline">سامانه مدیریت سفارش و خرید فروشگاه</p>

      {% if error %}
        <div class="login-error">{{ error }}</div>
      {% endif %}

      {% if mode == 'signup' %}
        <div class="login-hint">حساب جدید آزمایشی: شامل ۱ تأمین‌کننده و ۵ محصول برای شروع سریع.</div>
        <form method="POST" action="/signup">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="login-name-row">
            <input class="login-field" name="first_name" maxlength="100" placeholder="نام" aria-label="نام" autocomplete="given-name" value="{{ request.form.get('first_name', '') }}" required autofocus>
            <input class="login-field" name="last_name" maxlength="100" placeholder="نام خانوادگی" aria-label="نام خانوادگی" autocomplete="family-name" value="{{ request.form.get('last_name', '') }}" required>
          </div>
          <input class="login-field login-phone" name="mobile" maxlength="20" inputmode="tel" placeholder="شماره موبایل (مثلاً 09121234567)" aria-label="شماره موبایل" autocomplete="tel" value="{{ request.form.get('mobile', '') }}" required>
          <input class="login-field" name="username" maxlength="100" placeholder="نام کاربری" aria-label="نام کاربری" autocomplete="username" value="{{ request.form.get('username', '') }}" required>
          <input class="login-field" name="password" type="password" minlength="8" maxlength="128" placeholder="رمز عبور (حداقل ۸ کاراکتر)" aria-label="رمز عبور" autocomplete="new-password" required>
          <button type="submit" class="login-btn signup">ساخت حساب کاربری</button>
        </form>
        <div class="login-switch">
          قبلاً حساب ساختی؟ <a href="/login">ورود به لیستیا</a>
        </div>
      {% else %}
        <form method="POST" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input class="login-field" name="username" maxlength="100" placeholder="نام کاربری" aria-label="نام کاربری" autocomplete="username" required autofocus>
          <input class="login-field" name="password" type="password" placeholder="رمز عبور" aria-label="رمز عبور" autocomplete="current-password" required>
          <button type="submit" class="login-btn">ورود</button>
        </form>
        <div class="login-switch">
          حساب نداری؟ <a href="/signup">ساخت حساب جدید در لیستیا</a>
        </div>
      {% endif %}
    </div>

    <div class="login-credit">طراحی و توسعه: س.م.قتالی</div>
  </div>
</body>
</html>
