{% extends "base.html" %}
{% block title %}ویرایش تأمین‌کننده{% endblock %}

{% block content %}

  <a href="/suppliers" class="breadcrumb">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    بازگشت به تأمین‌کننده‌ها
  </a>

  <div class="page-head">
    <h1 class="page-title">ویرایش تأمین‌کننده</h1>
  </div>

  <div class="card card-pad" style="max-width:420px;">
    <form class="field-row" method="POST" action="/supplier/{{ supplier.id }}/edit">
      <input name="name" class="field" style="flex:1" value="{{ supplier.name }}" required>
      <button type="submit" class="btn btn-primary">ذخیره</button>
    </form>
  </div>

{% endblock %}
