{% extends "base.html" %}
{% block title %}کاربران{% endblock %}

{% block content %}

  <div class="page-head">
    <div>
      <h1 class="page-title">👤 کاربران</h1>
      <div class="page-sub">هر کاربر حساب خالی خودش را دارد و کالاهای بقیه را نمی‌بیند</div>
    </div>
  </div>

  <div id="message" class="flash" style="display:none;"></div>

  <div class="card card-pad" style="margin-bottom:22px;">
    <form id="add-user-form" class="field-row">
      <input id="username" name="username" class="field" style="width:180px" placeholder="نام کاربری" autocomplete="off" required>
      <input id="password" name="password" class="field" style="width:180px" placeholder="رمز عبور" type="password" autocomplete="new-password" required>
      <button id="add-user-btn" type="submit" class="btn btn-accent">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        افزودن کاربر
      </button>
    </form>
  </div>

  <div class="card" id="user-list-card" style="{{ 'display:none;' if not users }}">
    <div id="user-list">
      {% for u in users %}
        <div class="supplier-row" data-user-id="{{ u.id }}" style="{{ 'border-bottom:1px solid var(--border-soft);' if not loop.last }}">
          <span class="supplier-name">{{ u.username }}</span>
          <button type="button" class="icon-btn danger" title="حذف" onclick="deleteUser({{ u.id }})">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          </button>
        </div>
      {% endfor %}
    </div>
  </div>

  <div class="card empty-state" id="user-empty" style="{{ 'display:none;' if users }}">
    <div class="empty-icon">👤</div>
    هنوز کاربر دیگری اضافه نشده.
  </div>

  <script>
    document.getElementById("add-user-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) return;

      const btn = document.getElementById("add-user-btn");
      btn.disabled = true;

      fetch("/users", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded", "X-Requested-With": "fetch" },
        body: new URLSearchParams({ username, password })
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          btn.disabled = false;

          if (!data.success) {
            showError(data.message);
            return;
          }

          showSuccess("کاربر «" + data.username + "» اضافه شد");
          addUserRow(data.id, data.username);
          usernameInput.value = "";
          passwordInput.value = "";
          usernameInput.focus();
        })
        .catch(function () {
          btn.disabled = false;
          showError("خطا در ارتباط با سرور");
        });
    });

    function addUserRow(id, username) {
      document.getElementById("user-empty").style.display = "none";
      const card = document.getElementById("user-list-card");
      card.style.display = "block";

      const list = document.getElementById("user-list");
      const existingRows = list.querySelectorAll(".supplier-row");
      existingRows.forEach(function (row) { row.style.borderBottom = "1px solid var(--border-soft)"; });

      const row = document.createElement("div");
      row.className = "supplier-row";
      row.setAttribute("data-user-id", id);
      row.innerHTML =
        '<span class="supplier-name">' + escapeHtml(username) + '</span>' +
        '<button type="button" class="icon-btn danger" title="حذف" onclick="deleteUser(' + id + ')">' +
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>' +
        '</button>';

      list.appendChild(row);
    }

    function deleteUser(id) {
      if (!confirm("این کاربر حذف شود؟")) return;
      const row = document.querySelector('[data-user-id="' + id + '"]');
      if (!row) return;
      const next = row.nextElementSibling;
      const parent = row.parentNode;
      const backup = row.outerHTML;
      row.remove();

      fetch("/users/" + id + "/delete", {
        method: "POST",
        headers: { "X-Requested-With": "fetch" }
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok && data.success !== false, data: data }; }); })
        .then(function (result) {
          if (result.ok) return;
          restoreUserRow(parent, next, backup);
          showError((result.data && result.data.message) || "حذف انجام نشد");
        })
        .catch(function () {
          restoreUserRow(parent, next, backup);
          showError("خطا در ارتباط با سرور");
        });
    }

    function restoreUserRow(parent, next, html) {
      const holder = document.createElement("div");
      holder.innerHTML = html;
      const node = holder.firstElementChild;
      if (next && next.parentNode === parent) parent.insertBefore(node, next);
      else parent.appendChild(node);
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text == null ? "" : text;
      return div.innerHTML;
    }

    function showSuccess(text) {
      const el = document.getElementById("message");
      el.className = "flash flash-success";
      el.textContent = "✓ " + text;
      el.style.display = "inline-flex";
    }

    function showError(text) {
      const el = document.getElementById("message");
      el.className = "flash flash-error";
      el.textContent = "! " + text;
      el.style.display = "inline-flex";
    }
  </script>

{% endblock %}
