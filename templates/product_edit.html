{% extends "base.html" %}
{% block title %}ویرایش محصول · لیستیا{% endblock %}

{% block content %}

  <a href="/supplier/{{ product.supplier_id }}" class="breadcrumb">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    بازگشت
  </a>

  <div class="page-head">
    <h1 class="page-title">ویرایش محصول</h1>
  </div>

  <div class="card card-pad">
    <form method="POST" action="/product/{{ product.id }}/edit">
      <div class="field-row">
        <div style="width:200px;">
          <label class="field-label" for="edit-supplier">تأمین‌کننده:</label>
          <select id="edit-supplier" name="supplier_id" class="field" required>
            {% for s in suppliers %}
              <option value="{{ s.id }}" {{ 'selected' if s.id == product.supplier_id }}>{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div style="flex:1; min-width:180px;">
          <label class="field-label" for="edit-name">نام محصول:</label>
          <input id="edit-name" name="product" class="field" value="{{ product.product_name }}" required>
        </div>

        <div style="width:90px;">
          <label class="field-label" for="edit-qty">تعداد:</label>
          <input id="edit-qty" name="quantity" class="field mono" type="number" value="{{ product.quantity }}" required>
        </div>

        <div style="width:110px;">
          <label class="field-label" for="edit-unit">واحد:</label>
          <select id="edit-unit" name="unit" class="field" required>
            {% for u in unit_types %}
              <option value="{{ u }}" {{ 'selected' if product.unit == u }}>{{ u }}</option>
            {% endfor %}
          </select>
        </div>

        <div style="flex:1; min-width:180px;">
          <label class="field-label" for="edit-desc">توضیحات اختیاری:</label>
          <input id="edit-desc" name="description" class="field" value="{{ product.description or '' }}">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:20px;">ذخیره تغییرات</button>
      </div>
    </form>
  </div>

{% endblock %}
