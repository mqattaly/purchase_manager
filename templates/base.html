<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}مدیریت خرید{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <span class="brand-title">مدیریت خرید</span>
          <span class="brand-sub">Mqattaly</span>
        </div>
      </div>

      <nav class="nav">
        <span class="nav-label">منو</span>

        <a href="/" class="{{ 'active' if request.path == '/' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
          داشبورد
        </a>

        <a href="/new-purchase" class="{{ 'active' if request.path == '/new-purchase' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          ثبت خرید جدید
        </a>

        <a href="/purchases" class="{{ 'active' if request.path == '/purchases' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          لیست خریدها
        </a>

        <a href="/suppliers" class="{{ 'active' if request.path.startswith('/supplier') }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l7-4 7 4v12"/><path d="M10 21v-6h4v6M17 21V11l4-2v12"/></svg>
          تأمین‌کننده‌ها
        </a>
		
		<a href="/import" class="{{ 'active' if request.path == '/import' }}">
		  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 19h16"/></svg>
          ایمپورت اکسل
        </a>
		
		
		<a href="/logout" style="margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px 12px; color:var(--sidebar-ink); text-decoration:none; font-size:13px;">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
  خروج
</a>
		
      </nav>

      <div class="sidebar-footer">طراحی و توسعه س.م.قتالی</div>
    </aside>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

  </div>

</body>
