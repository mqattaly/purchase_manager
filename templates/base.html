<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142430">
  <title>{% block title %}مدیریت خرید{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"></noscript>

  <script src="{{ url_for('static', filename='app.js') }}?v={{ asset_v }}" defer></script>
</head>
<body>

  <div class="shell">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">خ</div>
        <div class="brand-text">
          <span class="brand-title">مدیریت خرید</span>
          <span class="brand-sub">لیست خرید فروشگاه</span>
        </div>
      </div>

      <nav class="nav">
        <span class="nav-label">منو</span>

        <a href="/" class="{{ 'active' if request.path == '/' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          ثبت سریع
        </a>

        <a href="/purchases" class="{{ 'active' if request.path == '/purchases' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
          لیست خریدها
        </a>

        <a href="/suppliers" class="{{ 'active' if request.path.startswith('/supplier') }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l7-4 7 4v12"/><path d="M10 21v-6h4v6M17 21V11l4-2v12"/></svg>
          تأمین‌کننده‌ها
        </a>

        <a href="/search" class="{{ 'active' if request.path == '/search' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          جستجوی محصول
        </a>

        <a href="/import" class="{{ 'active' if request.path == '/import' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 19h16"/></svg>
          ایمپورت اکسل
        </a>

        <a href="/account" class="{{ 'active' if request.path.startswith('/account') }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
          حساب من
        </a>
      </nav>

      <div class="sidebar-user">
        {% if current_user.is_authenticated %}
          <span class="sidebar-avatar">{{ current_user.username[:1]|upper }}</span>
          <span class="sidebar-username">{{ current_user.username }}</span>
        {% endif %}
        <a href="/logout" class="sidebar-logout" title="خروج">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </a>
      </div>

      <div class="sidebar-footer">طراحی و توسعه س.م.قتالی</div>
    </aside>

    <main class="content">
      <div id="global-search" class="global-search">
        <form id="global-search-form" class="global-search-form" action="{{ url_for('search') }}" method="GET" role="search">
          <svg class="global-search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input
            id="global-search-input"
            name="q"
            type="search"
            value="{{ request.args.get('q', '') if request.endpoint == 'search' else '' }}"
            placeholder="جستجوی زنده محصول یا تأمین‌کننده…"
            autocomplete="off"
            aria-label="جستجوی محصول یا تأمین‌کننده"
            aria-autocomplete="list"
            aria-controls="global-search-results"
            aria-expanded="false"
          >
          <span id="global-search-spinner" class="global-search-spinner" hidden aria-hidden="true"></span>
          <kbd class="global-search-shortcut" aria-hidden="true">/</kbd>
          <button class="global-search-submit" type="submit" aria-label="نمایش همه نتایج">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </form>

        <div id="global-search-panel" class="global-search-panel" hidden>
          <div id="global-search-status" class="global-search-status" role="status"></div>
          <div id="global-search-results" class="global-search-results" role="listbox" aria-label="نتایج جستجو"></div>
          <a id="global-search-all" class="global-search-all" href="{{ url_for('search') }}">
            مشاهده همه نتایج
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </a>
        </div>
      </div>

      {% block content %}{% endblock %}
    </main>

  </div>

</body>
</html>
