<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به لیستیا</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #142430; color: #fff; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    p { opacity: .85; }
  </style>
</head>
<body>
  <p>در حال ورود به داشبورد…</p>
  <script>
    (function () {
      var token = {{ token|tojson }};
      try { localStorage.setItem("listia_auth", token); } catch (e) {}
      try { sessionStorage.removeItem("listia_auth_fail"); } catch (e) {}
      location.replace("/?auth=" + encodeURIComponent(token));
    })();
  </script>
</body>
</html>
